# Reachability map settings. Build the map with: ros2 launch panda_arm_control reachability_map.launch.py
# random_placement (weighted sampling) and reachability_climb load it, also reading this file, and only accept a map built
# with the same settings (and robot, group, tool link).
/**:
  ros__parameters:
    reach_map_file: ""                    # cache; empty = ~/.ros/reachability_<group>.bin
    reach_map_samples: 10000000           # random joint configurations
    reach_map_self_collision: true        # drop samples where the arm hits itself
    reach_map_voxel: 0.04                 # m: position cell size
    reach_map_directions: 100             # approach-direction (tool z) bins over the sphere
    reach_map_limit_sharpness: 20.0       # samples count by their joint-limit room; 0 = all count 1
    reach_map_seed: 42
