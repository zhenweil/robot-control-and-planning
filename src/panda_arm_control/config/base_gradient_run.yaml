# Example run settings for base_gradient.launch.py params_file:=...
# Node parameter names (bg_ prefix); loaded last, so these override the launch arguments.
# Positions and bounds are abs (m, base frame).
/**:
  ros__parameters:
    # Start position and bounds
    bg_initial_x: 0.4
    bg_initial_y: 0.0
    bg_initial_z: 0.55
    bg_x_min: -0.6
    bg_x_max: 0.6
    bg_y_min: -0.6
    bg_y_max: 0.6
    bg_z_min: -0.7
    bg_z_max: 0.7

    # Descent
    bg_descent_num_restart: 3                # descents; each restart first jumps up the reached viewpoints' manipulability
    bg_jump_softmin_weight: 100.0            # jump score: sum of manipulability + this x soft-min
    bg_jump_max_moves: 10                    # moves per manipulability jump
    bg_reach_outer_iterations: 0             # after all reached + refined: steps up the reachability map, each re-solved; 0 = off
    bg_reach_outer_step: 0.1                 # m, halved when a step does not lower the cost
    bg_stop_when_all_reached: true
    bg_reach_time_limit: 120.0              # s per descent to reach every viewpoint, then stuck; 0 = none
    bg_reach_patience: 3                     # reach iterations without gaining a viewpoint, then stuck (jump + restart)
    bg_refine_solves: 3                      # after all reached: full solves, kept by lowest cost (planned travel, comfort)
    bg_refine_ik_solutions: 8                # IK solutions per viewpoint in those solves
    bg_reconfig_threshold: 1.0               # rad: a move turning any joint (joint 7 aside) more than this is a reconfiguration
    bg_room_then_reach: true                 # when stuck: aim at a missed viewpoint; if reached ones are lost, back off for what ran out
    bg_room_max_targets: 3                   # missed viewpoints room-then-reach tries per call, closest first; 0 = all
    bg_trace_line_search: false
    bg_initial_step: 0.05                    # m: largest object move per iteration (first probe)
    bg_step_shrink: 0.5                     # each failed probe tries step * this
    bg_max_line_search_iters: 4              # probes per iteration before giving up

    # IK: a fixed number of attempts instead of a time limit, so the same random_seed repeats the run
    ik_attempts: 30

    # Cost
    bg_travel_gradient: true
    bg_planned_travel_in_cost: true
    bg_real_cost_planning_time: 0.5
    bg_manipulability_weight: 1.0            # while viewpoints are missed: cost -= this * sum of manipulability
    bg_softmin_manipulability_weight: 1000.0 # while viewpoints are missed: cost -= this * soft-min manipulability (worst poses)
    bg_softmin_tau: 0.01                     # soft-min: small = only the worst pose, large = closer to the average
    bg_manipulability_limit_sharpness: 20.0  # joints near a limit count less in manipulability; 0 = plain
    bg_miss_gap_weight: 200.0
    bg_closest_ik_starts: 5                  # closest-IK starts per missed viewpoint (only runs while viewpoints are missed)
